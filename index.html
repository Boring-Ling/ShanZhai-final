<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030507">
  <title>抖歪</title>
  <link rel="stylesheet" href="styles.css?v=pool-dock-1">
  <link rel="stylesheet" href="glass-background.css?v=usagi-1">
</head>
<body>
  <div id="glass-background" aria-hidden="true"><canvas id="glass-tiles"></canvas></div>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="camera-icon" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v14H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="heart-icon" viewBox="0 0 24 24"><path d="M12 21 3.5 12.5C-3 5 7 0 12 7c5-7 15-2 8.5 5.5Z"/></symbol>
    <symbol id="comment-icon" viewBox="0 0 24 24"><path d="M21 11c0 6-7 10-14 8l-5 3 1-6C-3 6 6 0 14 3c4 1 7 4 7 8Z"/><path d="M6 10h1m4 0h1m4 0h1"/></symbol>
    <symbol id="star-icon" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1Z"/></symbol>
    <symbol id="share-icon" viewBox="0 0 24 24"><path d="m14 2 9 9-9 8v-5C7 14 3 17 1 22 1 10 6 8 14 8Z"/></symbol>
    <symbol id="sound-icon" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3Z"/><path d="M16 7q6 5 0 10m3-13q9 8 0 16"/></symbol>
    <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  </defs></svg>
  <main class="workbench">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="重新开始抖歪">抖<span>歪</span></a>
      <button id="reset" class="reset">重新开始 ↺</button>
    </header>

    <div class="experiment">
      <section class="camera-panel" aria-label="实时摄像头">
        <div class="camera-frame">
          <video id="camera" autoplay muted playsinline aria-label="16比9实时摄像头画面"></video>
          <canvas id="dye-canvas" width="1280" height="720" hidden aria-label="随刷动累积的实时皮肤染色画面"></canvas>
          <canvas id="features-canvas" width="1280" height="720" hidden aria-hidden="true"></canvas>
          <div class="camera-grid" aria-hidden="true"></div>
          <span class="viewfinder top-left"></span><span class="viewfinder top-right"></span><span class="viewfinder bottom-left"></span><span class="viewfinder bottom-right"></span>
          <div class="camera-empty" id="camera-empty"><svg aria-hidden="true"><use href="#camera-icon"/></svg><p id="camera-message" role="status"></p><button id="enable-camera" class="paper-button">开启摄像头 ↗</button></div>
        </div>
        <div class="effect-controls"><span id="tracking-status" role="status"></span><strong id="effect-progress">染色 0%</strong><button id="retry-effect" class="paper-button" hidden>重试特效 ↻</button></div>
      </section>

      <section class="phone-panel" aria-label="短视频">
        <div class="phone-frame" id="phone-frame" tabindex="0" aria-label="短视频，滚轮或上下方向键切换">
          <div id="feed-stage" class="feed-stage"></div>
          <div class="feed-top"><span class="hamburger" aria-hidden="true">☰</span><span>关注</span><strong>推荐</strong><button id="sound" aria-label="开启视频声音" title="开启视频声音"><svg><use href="#sound-icon"/></svg><span class="mute-mark">×</span></button></div>
          <div class="feed-bottom"><strong>首页</strong><span>朋友</span><span class="post-plus">＋</span><span>消息</span><span>我</span></div>
          <button id="retry-video" class="video-retry" hidden>视频加载失败，点击重试</button>
          <div class="comments" id="comments" hidden><div class="comments-title"><strong>评论 <span id="comments-total">0</span></strong><button id="close-comments" aria-label="关闭评论">×</button></div><div id="comment-list" class="comment-list"></div><form id="comment-form"><input id="comment-input" placeholder="留下你的评论…" maxlength="160" aria-label="评论内容" required><button type="submit">发送</button></form></div>
        </div>
        <div class="feed-footer">
          <button type="button" id="next" class="next-button" aria-label="下一条视频"><svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
        </div>
      </section>
      <div id="pool" class="pool-avatars" role="group" aria-label="内容池">
        <button type="button" data-pool="nailong" aria-label="奶龙 / 奶蛙" title="奶龙 / 奶蛙" aria-pressed="true"><img src="assets/pool-nailong.png" alt=""></button>
        <button type="button" data-pool="lulu" aria-label="噜噜" title="噜噜" aria-pressed="false"><img src="assets/pool-lulu.png" alt=""></button>
        <button type="button" data-pool="jokebear" aria-label="Joke Bear" title="Joke Bear" aria-pressed="false"><img src="assets/pool-jokebear-cutout.png" alt=""></button>
        <button type="button" data-pool="chiikawa" aria-label="吉伊" title="吉伊" aria-pressed="false"><img src="assets/pool-chiikawa.png" alt=""></button>
        <button type="button" data-pool="usagi" aria-label="乌萨奇" title="乌萨奇" aria-pressed="false"><img src="assets/pool-usagi.png" alt=""></button>
        <button type="button" data-pool="hachiware" aria-label="小八" title="小八" aria-pressed="false"><img src="assets/pool-hachiware.png" alt=""></button>
      </div>
    </div>
  </main>
  <div id="toast" role="status" class="toast" hidden></div>
  <script src="app.js?v=character-features-3" type="module"></script>
  <script src="glass-background.js" type="module"></script>
</body>
</html>
